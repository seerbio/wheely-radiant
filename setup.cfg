[metadata]
name = wheely-radiant
author = Seth Just
author_email = sjust@seer.bio
description = Reader for Radiant DIA results, compatible with wheely-mammoth
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/seerbio/wheely-radiant
project_urls =
    Bug Tracker = https://github.com/seerbio/wheely-radiant/issues
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Bio-Informatics

[options]
packages = find:
python_requires = >=3.8
install_requires =
    pyspark[sql]>=3.5.0,<4.0.0

    wheely-mammoth>=0.16.3,<1.0.0

    importlib_metadata; python_version < "3.8"

[options.extras_require]
docs =
    numpydoc>=1.0.0
    sphinx-argparse>=0.2.5
    sphinx-rtd-theme>=0.5.0
    nbsphinx>=0.7.1
    ipykernel>=5.3.0
    recommonmark>=0.5.0
dev =
    pre-commit>=2.7.1
    black>=20.8b1
    pytest
    pandas

[options.entry_points]
wheely.mammoth.parsers.plugins =
    radiant = wheely_radiant.parsers:read_radiant_features
wheely.mammoth.spectra.plugins =
    radiant = wheely_radiant.parsers:read_radiant_spectra
fulcrum.quant.peptide.plugins =
    radiant_top_corr = wheely_radiant.quant:quantify_radiant
