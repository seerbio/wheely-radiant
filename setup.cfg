[metadata]
name = python-project-template
author = Seth Just
author_email = sjust@seer.bio
description = Template repository for Python tools or libraries
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/seerbio/python-project-template
project_urls =
    Bug Tracker = https://github.com/seerbio/python-project-template/issues
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Bio-Informatics

[options]
packages = find:
python_requires = >=3.6
install_requires =

[options.extras_require]
docs =
    numpydoc>=1.0.0
    sphinx-argparse>=0.2.5
    sphinx-rtd-theme>=0.5.0
    nbsphinx>=0.7.1
    ipykernel>=5.3.0
    recommonmark>=0.5.0
dev =
    pre-commit>=2.7.1
    black>=20.8b1

[options.entry_points]
console_scripts =
